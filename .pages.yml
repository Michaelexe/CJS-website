media:
  - name: images
    label: Blog Images
    input: images/blog
    output: /images/blog
    categories: [image]
  - name: downloads
    label: Download Files
    input: downloads
    output: /downloads
    categories: [document]
content:
  - name: program
    label: Program Page
    type: file
    path: content/program.json
    fields:
      - name: eyebrow
        label: Eyebrow
        type: string
      - name: title
        label: Title
        type: string
      - name: subtitle
        label: Subtitle
        type: text
      - name: heroImage
        label: Hero Image
        type: image
        options:
          media: images
      - name: intro
        label: Introduction
        type: rich-text
        options:
          media: images
          categories: [image]
      - name: highlights
        label: Program Highlights
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
          - name: description
            label: Description
            type: text
      - name: sections
        label: Program Sections
        type: object
        list: true
        fields:
          - name: title
            label: Section Title
            type: string
          - name: content
            label: Content
            type: rich-text
            options:
              media: images
              categories: [image]
      - name: download
        label: Download
        type: object
        fields:
          - name: backgroundImage
            label: Background Image
            type: image
            options:
              media: images
          - name: label
            label: Button Label
            type: string
          - name: description
            label: Description
            type: text
          - name: file
            label: Program File
            type: file
            options:
              media: downloads
              categories: [document]
      - name: cta
        label: Call To Action
        type: object
        fields:
          - name: title
            label: Title
            type: string
          - name: text
            label: Text
            type: text
          - name: buttonLabel
            label: Button Label
            type: string
          - name: buttonHref
            label: Button Link
            type: string
  - name: blog
    label: Blog Posts
    type: file
    path: content/blog/posts.json
    fields:
      - name: posts
        label: Posts
        type: object
        list: true
        fields:
          - name: slug
            label: Slug
            type: string
          - name: title
            label: Title
            type: string
          - name: publishedAt
            label: Publish Date
            type: date
          - name: author
            label: Author
            type: string
          - name: excerpt
            label: Excerpt
            type: text
          - name: coverImage
            label: Cover Image
            type: image
            options:
              media: images
          - name: content
            label: Content
            type: rich-text
            options:
              media: images
              categories: [image]
