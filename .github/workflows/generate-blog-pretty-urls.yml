name: Generate Blog Pretty URLs

on:
  push:
    paths:
      - content/blog/posts.json
      - blog/_templates/post.html
      - scripts/generate-blog-pages.mjs
      - .github/workflows/generate-blog-pretty-urls.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate blog slug pages
        run: node scripts/generate-blog-pages.mjs

      - name: Commit generated pages
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add blog
            git commit -m "chore: regenerate blog pretty URLs [skip ci]"
            git push
          else
            echo "No generated page changes"
          fi
